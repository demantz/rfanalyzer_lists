- id: hf-aprs-30m
  name: HF APRS 30m (300 Bd)
  mode: AX25
  frequency: 10149300
  bandwidth: 300
  params:
    ax25: {baudRate: 300}
  notes: 'The signal centre: 1700 Hz above the USB dial frequency 10.1476 MHz (1600/1800 Hz tones); the same signal
    as the legacy 10.151 MHz LSB spec. Source: aprs.org/APRS-docs/HF.TXT.'
