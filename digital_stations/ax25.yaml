- id: 9600-baud-packet-backbone-db0avh
  name: 9600 Baud Packet Backbone (DB0AVH)
  mode: AX25
  frequency: 438450000
  bandwidth: 25000
  countries: [DE]
  location: {lat: 50.11, lon: 8.68}
  params:
    ax25: {baudRate: 9600}
  notes: Representative node of Germany's FlexNet 9600-baud digipeater network (G3RUH modulation, +/-3 kHz deviation,
    ~20 kHz occupied BW). Declining but still active.
